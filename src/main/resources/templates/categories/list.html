<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Categories')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar('categories')}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Complaint Categories</h1>
                <p class="page-subtitle">Manage maintenance categories (e.g. Plumbing, Electrical, Carpentry)</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div style="display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; align-items: start;">
            <!-- Categories Table -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Available Categories</h2>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td th:text="'#' + ${category.id}">#1</td>
                                <td style="font-weight: 600;" th:text="${category.name}">Electrical</td>
                                <td th:text="${category.description != null ? category.description : '-'}">Fan, lighting, switches</td>
                                <td>
                                    <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="POST" style="display: inline;"
                                          onsubmit="return confirm('Delete this category?');">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="4">
                                    <div class="empty-state">
                                        <div class="empty-state-icon">🏷️</div>
                                        <p>No categories defined yet.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Category Form -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Add Category</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/categories/new}" method="POST">
                        <div class="form-group">
                            <label class="form-label" for="name">Category Name *</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Electrical, Plumbing" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-textarea" id="description" name="description" rows="3" 
                                      placeholder="Brief details about what issues fall under this category"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Category</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
