<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html_head('Residents')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar('residents')}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Resident Management</h1>
                <p class="page-subtitle">Manage hostel residents and room allocations</p>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div style="display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; align-items: start;">
            <!-- Residents Table -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Registered Residents</h2>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Room Number</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="resident : ${residents}">
                                <td th:text="'#' + ${resident.id}">#1</td>
                                <td style="font-weight: 600;" th:text="${resident.name}">John Doe</td>
                                <td th:text="${resident.email}">john@hostel.edu</td>
                                <td><span class="badge badge-role" th:text="${resident.roomNumber}">101</span></td>
                                <td>
                                    <form th:action="@{/residents/{id}/delete(id=${resident.id})}" method="POST" style="display: inline;"
                                          onsubmit="return confirm('Delete this resident?');">
                                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(residents)}">
                                <td colspan="5">
                                    <div class="empty-state">
                                        <div class="empty-state-icon">👥</div>
                                        <p>No residents registered yet.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Resident Form -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Add Resident</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/residents/new}" method="POST">
                        <div class="form-group">
                            <label class="form-label" for="name">Full Name *</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Alex Johnson" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="alex@hostel.edu" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="roomNumber">Room Number *</label>
                            <input type="text" class="form-control" id="roomNumber" name="roomNumber" placeholder="e.g. B-204" required />
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Resident</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
